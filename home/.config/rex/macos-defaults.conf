# Rex app settings (macOS defaults domain: com.superlogical.rex)
#
# Rex's init.lua only configures keys, actions, and hosts. Fonts, cursor,
# keyboard, padding, tabs, and sidebar live in the app's macOS defaults, so
# `dot stow`/`dot update` write the values below with `defaults write`.
# Rex reads them at launch: relaunch the app after changing this file.
#
# Format: KEY TYPE VALUE   (TYPE is a `defaults write` type: string, int,
# float, bool). Lines starting with # are ignored.
#
# Key names come from the app binary:
#   strings "/Applications/Rex Beta.app/Contents/MacOS/Rex" | grep '^Workspace\.'
# Enum values sit next to each other in that output (e.g. terminalPaddingColor
# is background | extend | extendAlways).
#
# The theme is NOT set here: Workspace.customThemes is a JSON blob keyed by a
# generated ID. dot imports themes/catppuccin-macchiato through the
# import_catppuccin_macchiato action in init.lua when it is missing.

# --- Ported from ~/.config/ghostty/config ------------------------------------

# font-family = MonoLisa, font-size = 18
Workspace.terminalFontName              string  MonoLisa
Workspace.terminalFontPointSize         int     18

# macos-option-as-alt = true
# (automatic | composesText | actsAsAlt | leftActsAsAlt | rightActsAsAlt)
Workspace.terminalOptionKeyBehavior     string  actsAsAlt

# window-padding-color = background  (background | extend | extendAlways)
Workspace.terminalPaddingColor          string  background

# unfocused-split-opacity = 0.97 -> fade inactive panes
Workspace.inactivePaneFadeMode          string  both

# Not portable from Ghostty: cursor-style-blink (Rex blinks by default),
# mouse-scroll-multiplier, window-padding-x/y, window-width/height,
# clipboard-read/write, shell-integration (Rex uses the login shell, fish),
# title, macos-titlebar-proxy-icon, auto-update-channel.

# --- Rex-only preferences ----------------------------------------------------

Workspace.interfaceStyle                string  useTheme
Workspace.lightThemeID                  string  merino-light
Workspace.tabStyle                      string  vertical
Workspace.sidebarPosition               string  left
Workspace.sidebarWidth                  float   227
Workspace.sidebarShowsActivity          bool    false
Workspace.usesPaneGlass                 bool    false
Workspace.tabIconTintMode               string  off

# Lets `rex do` / `rex -C` run client actions (theme import, update accept).
rex.client.remoteControl                bool    true
rex.server.automatic-restart-enabled    bool    true
